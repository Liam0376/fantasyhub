name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        # requirements-ml.txt for train_model/backtest tests (numpy+xgboost),
        # requirements-dev.txt for pytest itself. Network-marked tests probe
        # api.sleeper.app and self-skip when unreachable.
        run: pip install -r requirements.txt -r requirements-ml.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest api/ scripts/ -q --tb=short
