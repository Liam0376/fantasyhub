name: Daily Projections

on:
  schedule:
    # 6:00 UTC every day — keeps projections fresh
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (leave empty for auto-detect)'
        required: false
      season:
        description: 'NFL season year'
        required: false

permissions:
  contents: write
  issues: write

# Never stack runs: a queued run would commit on top of the previous one
# and the push can race. Cancel the older in-flight run instead.
concurrency:
  group: weekly-projections
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    # compute_week.py downloads ~100MB of PBP CSVs and projects 17 weeks
    # x 1000+ players; the 30-min cap killed a healthy run. 60 still
    # bounds a real hang well under the 6h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        # Pipeline deps (xgboost/numpy) live in requirements-ml.txt, NOT
        # requirements.txt: the serverless runtime must stay under Vercel's
        # 500MB bundle cap, and xgboost's linux wheels pull nvidia-nccl-cu12.
        # Major-version caps: the ML gate was validated on xgboost 2.x /
        # numpy 1.x-2.x; an uncapped major bump would silently change predictions.
        run: pip install -r requirements-ml.txt -r requirements-dev.txt

      - name: Run tests
        # Gate the cron on a green suite: a red test must stop rot before
        # it commits new projections. Network-marked tests self-skip when
        # Sleeper is unreachable, so a Sleeper outage doesn't block the
        # compute (the pipeline needs nflverse/GitHub, not Sleeper).
        run: python -m pytest api/ scripts/ -q --tb=short

      - name: Compute projections
        # Inputs go through env vars, not format(): dispatch inputs are
        # attacker-injectable shell text in the general case, and even a
        # benign typo would break the interpolation. Validate + pass as
        # argv, so only digits ever reach the command line.
        env:
          INPUT_WEEK: ${{ github.event.inputs.week }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          ARGS=()
          if [ -n "$INPUT_WEEK" ]; then
            case "$INPUT_WEEK" in
              *[!0-9]*) echo "invalid week: $INPUT_WEEK" >&2; exit 1 ;;
            esac
            ARGS+=(--week "$INPUT_WEEK")
          fi
          if [ -n "$INPUT_SEASON" ]; then
            case "$INPUT_SEASON" in
              *[!0-9]*) echo "invalid season: $INPUT_SEASON" >&2; exit 1 ;;
            esac
            ARGS+=(--season "$INPUT_SEASON")
          fi
          python -u scripts/compute_week.py "${ARGS[@]}"

      - name: Snapshot injuries
        run: python scripts/fetch_injuries.py

      - name: Snapshot players
        run: python scripts/snapshot_players.py

      - name: Snapshot FantasyCalc market values
        # Market trade values for the trade lab (model-vs-market package
        # comparison). Non-fatal: hub_trade degrades to model-only when
        # the snapshot is absent or stale.
        run: python scripts/snapshot_fantasycalc.py || echo "fantasycalc snapshot failed, continuing"

      - name: Grade last week predictions
        # Joins the latest final week's projections against nflverse actuals
        # and appends to data/grades/weekly.json (2026 evidence base for the
        # ML gate + star-miscalibration monitor). Auto-detects target, skips
        # non-final weeks (MNF processes last), never fails the pipeline —
        # a grading gap is a missing row, not a broken deploy.
        run: python scripts/grade_weekly_predictions.py

      - name: Guard freshness
        # compute_week.py has exited 0 with stale/empty output before.
        # Fail loudly so the cron alert fires instead of committing rot.
        # Grades + ML assertions: an ML pipeline that silently stops
        # shipping (ship=false, 0 adjusted rows) or stops grading is a
        # regression too — catching it here keeps ACCURACY.md honest.
        run: |
          python -c "
          import json, sys
          from datetime import datetime, timezone, timedelta
          d = json.load(open('data/projections/latest.json'))
          ts = datetime.fromisoformat(d['updated_at'])
          assert datetime.now(timezone.utc) - ts < timedelta(hours=30), f\"stale: {d['updated_at']}\"
          assert len(d.get('players', [])) > 500, f\"too few players: {len(d.get('players', []))}\"

          meta = json.load(open('data/models/ml_meta.json'))
          n_ml = sum(1 for p in d['players'] if p.get('ml_adjustment'))
          if meta.get('ship'):
              assert n_ml > 0, 'ml_meta ship=true but 0 ML-adjusted players in output'

          grades = json.load(open('data/grades/weekly.json'))
          assert grades, 'data/grades/weekly.json is empty'
          newest = max(grades, key=lambda e: e['graded_at'])
          newest_ts = datetime.fromisoformat(newest['graded_at'])
          # Age-check only in the regular season of the same year the
          # grades belong to: the cron runs year-round, and playoffs
          # (week 19+) / offseason legitimately produce no new grades.
          if newest['season'] == d['season'] and d['week'] <= 18:
              assert datetime.now(timezone.utc) - newest_ts < timedelta(days=30), f\"grades stale: {newest_ts}\"
          print(f\"fresh: week {d['week']} season {d['season']} n={len(d['players'])} n_ml={n_ml} newest_grade={newest['season']} w{newest['week']}\")
          "

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projections/ data/injuries/ data/players/ data/slate/ data/grades/ data/market/
          git diff --cached --quiet || git commit -m "chore: update projections $(date -u +%Y-%m-%d)"
          # Rebase before push: manual dispatch runs can overlap the
          # scheduled run just enough for the remote to have moved.
          git pull --rebase origin main
          git push

      - name: Open failure issue
        # A silently red cron rots for weeks; file an issue so the
        # failure is visible outside the Actions tab.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Daily Projections failed: $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "issue creation failed, continuing"
