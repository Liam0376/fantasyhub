name: Daily Projections

on:
  schedule:
    # 6:00 UTC every day — keeps projections fresh
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (leave empty for auto-detect)'
        required: false
      season:
        description: 'NFL season year'
        required: false

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Compute projections
        run: |
          python scripts/compute_week.py \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }} \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }}

      - name: Snapshot injuries
        run: python scripts/fetch_injuries.py

      - name: Snapshot players
        run: python scripts/snapshot_players.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projections/ data/injuries/ data/players/ data/slate/
          git diff --cached --quiet || git commit -m "chore: update projections $(date -u +%Y-%m-%d)"
          git push
